name: immagine

# Solo a mano: da quando il Dockerfile e' unico, questo job costruirebbe anche
# lo stage con PyTorch -- dieci minuti di pip e piu' disco di quanto ne abbia un
# runner. La build vera si fa sulla .35, questo resta per la sola base
# (`--target base` va aggiunto prima di lanciarlo sul serio).
on:
  workflow_dispatch:

jobs:
  costruisci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llmduo:latest
            ghcr.io/${{ github.repository_owner }}/llmduo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
