name: immagine

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  costruisci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # la compilazione CUDA riempie il disco del runner: si fa spazio prima
      - name: Libera spazio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llmduo:latest
            ghcr.io/${{ github.repository_owner }}/llmduo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
